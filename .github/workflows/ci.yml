name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - name: Install
              run: bun install --frozen-lockfile
            - name: Format check
              run: bun run format:check
            - name: Lint
              run: bun run lint
            - name: Typecheck
              run: bun run typecheck
            - name: Dead-code check
              run: bun run deadcode
            - name: Test
              run: bun run test
            - name: Build
              run: bun run build
            - name: Size budget
              run: bun run size

    lint-docs:
        name: Lint docs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - name: Install markdownlint
              run: bun add -g markdownlint-cli2
            - name: Markdown lint
              run: markdownlint-cli2 '**/*.md' '#node_modules' '#dist' '#coverage' '#.opencode'
            - name: Link check
              uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
              with:
                  args: --config lychee.toml '**/*.md'
                  fail: true

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - name: Install
              run: bun install --frozen-lockfile
            - name: Coverage
              run: bun run test:coverage
            - name: Upload coverage artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage
                  path: coverage/
                  retention-days: 14

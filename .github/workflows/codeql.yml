name: CodeQL

# CodeQL on private repos requires GitHub Advanced Security. Until this
# repo is flipped to public, the workflow runs only on manual dispatch
# (and will still fail until code scanning is enabled in repo settings).
#
# To re-enable automatic scans after going public:
#   1. Settings → Code security → Code scanning → Set up → Default,
#      then either accept the auto-generated workflow OR keep this one.
#   2. Replace the `on:` block below with:
#        on:
#          push:        { branches: [main] }
#          pull_request: { branches: [main] }
#          schedule:    [{ cron: "37 4 * * 1" }]

on:
    workflow_dispatch:

permissions:
    actions: read
    contents: read
    security-events: write

jobs:
    analyze:
        name: Analyze ${{ matrix.language }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                language: ["javascript-typescript"]
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
            - uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
              with:
                  languages: ${{ matrix.language }}
            - uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3.36.0
              with:
                  category: "/language:${{ matrix.language }}"

name: release-please

on:
    push:
        branches: [main]

# Top-level: minimum permissions; the publish job escalates as needed.
permissions:
    contents: read

jobs:
    release-please:
        runs-on: ubuntu-latest
        # Job-level scope: release-please needs to create tags + open PRs.
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

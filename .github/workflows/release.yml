name: Release

on:
    push:
        tags:
            - "v*.*.*"

# Top-level: minimum permissions. Job-level escalates only what's needed.
permissions:
    contents: read

jobs:
    publish:
        name: Build, test, publish
        runs-on: ubuntu-latest
        # contents:write -> create GitHub Release; id-token:write -> npm OIDC
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest

            - name: Setup Node (for npm publish)
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"

            - name: Upgrade npm to >=11.5.1 (required for trusted publishing)
              # Pinned to keep the build reproducible and to satisfy
              # OSSF Scorecard's Pinned-Dependencies check.
              run: npm install -g npm@11.5.1

            - name: Install
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

            - name: Generate SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  format: spdx-json
                  output-file: sbom.spdx.json

            - name: Verify tag matches package.json
              run: |
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
                    echo "Tag ${GITHUB_REF_NAME} does not match package.json version $PKG_VERSION"
                    exit 1
                  fi

            # OIDC trusted publishing: npm CLI auto-detects the OIDC
            # environment (id-token: write permission above) and exchanges
            # it for a short-lived publish token. No NPM_TOKEN needed.
            # Provenance is generated automatically; the --provenance flag
            # is not necessary and is omitted.
            - name: Publish to npm (via OIDC trusted publishing)
              run: npm publish --access public

            # Download the just-published tarball + its SLSA provenance
            # attestation so they can be attached to the GitHub Release.
            # OSSF Scorecard's Signed-Releases check looks for a *.intoto.jsonl
            # file alongside release artifacts.
            - name: Download release artifacts for GitHub Release
              run: |
                  set -euo pipefail
                  PKG_NAME=$(node -p "require('./package.json').name")
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  TARBALL="${PKG_NAME}-${PKG_VERSION}.tgz"

                  # Tarball
                  curl -sSL --fail \
                      "https://registry.npmjs.org/${PKG_NAME}/-/${TARBALL}" \
                      -o "${TARBALL}"

                  # SLSA provenance attestation (intoto bundle)
                  curl -sSL --fail \
                      "https://registry.npmjs.org/-/npm/v1/attestations/${PKG_NAME}@${PKG_VERSION}" \
                      -o "${TARBALL}.intoto.jsonl"

                  ls -la "${TARBALL}" "${TARBALL}.intoto.jsonl"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
              with:
                  generate_release_notes: true
                  files: |
                      sbom.spdx.json
                      *.tgz
                      *.tgz.intoto.jsonl

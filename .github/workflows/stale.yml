name: Stale

on:
    schedule:
        - cron: "23 1 * * *"
    workflow_dispatch:

# Top-level: read-only. Job-level escalates only what's needed.
permissions:
    contents: read

jobs:
    stale:
        runs-on: ubuntu-latest
        # actions/stale needs to comment on + close stale issues/PRs.
        permissions:
            issues: write
            pull-requests: write
        steps:
            - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
              with:
                  days-before-issue-stale: 60
                  days-before-issue-close: 14
                  days-before-pr-stale: 30
                  days-before-pr-close: 14
                  stale-issue-label: "stale"
                  stale-pr-label: "stale"
                  stale-issue-message: |
                      This issue has been automatically marked as stale because
                      it has had no activity for 60 days. It will be closed in
                      14 days if no further activity occurs. Comment to keep it
                      open.
                  stale-pr-message: |
                      This PR has been automatically marked as stale because
                      it has had no activity for 30 days. It will be closed
                      in 14 days if no further activity occurs. Comment, push
                      a new commit, or rebase to keep it open.
                  exempt-issue-labels: "pinned,security"
                  exempt-pr-labels: "pinned,security"
                  operations-per-run: 100

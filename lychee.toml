# lychee link-checker config
# https://lychee.cli.rs

max_concurrency = 8
max_retries = 2
retry_wait_time = 2
timeout = 20

# Skip URLs that we know 404 until first publish / public flip.
exclude = [
    # npm package URL — 404 until first publish.
    "https://www.npmjs.com/package/opencode-gemini-rotator",
    # GitHub security advisory page — 404 on private repos for non-collaborators.
    "https://github.com/jianlingzhong/opencode-gemini-rotator/security/advisories/new",
    # GitHub Actions badges/links — 404 on private repos for non-collaborators
    # (anonymous fetch returns 404 even when CI is real and green).
    "https://github.com/jianlingzhong/opencode-gemini-rotator/actions/workflows/.*",
]

# Ignore mailto links — lychee can't validate without SMTP.
include_mail = false

# Ignore loopback / private addresses.
exclude_loopback = true
exclude_private = true
exclude_link_local = true

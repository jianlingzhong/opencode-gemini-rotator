# lychee link-checker config
# https://lychee.cli.rs

max_concurrency = 8
max_retries = 2
retry_wait_time = 2
timeout = 20

# URLs that are not (yet) reachable anonymously.
exclude = [
    "https://www.npmjs.com/package/opencode-gemini-rotator",
    # Compare/tag links auto-generated by release-please reference tags
    # that don't exist until the release workflow actually publishes them.
    "https://github.com/jianlingzhong/opencode-gemini-rotator/compare/.*",
    "https://github.com/jianlingzhong/opencode-gemini-rotator/releases/tag/.*",
]

# Ignore mailto links — lychee can't validate without SMTP.
include_mail = false

# Ignore loopback / private addresses.
exclude_loopback = true
exclude_private = true
exclude_link_local = true
